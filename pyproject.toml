[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pocket-conservation"
version = "0.1.0"
description = "Ligand-defined CA2 pocket conservation case study"
requires-python = ">=3.11"
dependencies = ["biopython>=1.85,<2", "numpy>=2.2,<3", "matplotlib>=3.10,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
